[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tahoe-telemetry"
version = "1.0.0"
description = "Windows OBD-II telemetry GUI for a 2004 Chevrolet Tahoe"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
tahoe-telemetry = "tahoe_telemetry.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["tahoe_telemetry*"]

